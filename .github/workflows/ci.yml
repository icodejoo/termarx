name: CI

# 唯一的 CI：目前只构建 Windows x64 安装包，成功后发布 GitHub Release。
# Linux、macOS 的构建任务先屏蔽了（job 上的 `if: false`），要恢复就删掉那一行，
# 并把它们加回 publish-release 的 needs 和 files。
# 全量测试默认不跑，需要时开启（跑起来与构建并行，失败会让工作流变红，但不拦截发布）：
#   - 手动触发：勾选 run_tests；
#   - 推 tag：tag 指向的提交信息里含 [test]。
# fork 专用发布流程：不依赖 Apple 签名/公证 secrets，macOS 产出未签名 DMG。
# 版本号唯一来源是 crates/desktop_app/Cargo.toml 的 version：
#   应用内显示、安装包文件名、Git tag（v + 版本号）都由它派生，不再手填。
# 触发方式：在 Actions 页面手动运行（自动创建 tag），或推送与 Cargo 版本一致的 v* tag。
# 版本号只能是数字和点：rpm 的 Version 字段不允许连字符。

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      run_tests:
        description: "同时跑全量测试（大改动勾选；小改动不跑）"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: false

env:
  INNOSETUP_VERSION: 6.7.1
  APPIMAGETOOL_VERSION: 1.9.1
  APPIMAGETOOL_X86_64_SHA256: ed4ce84f0d9caff66f50bcca6ff6f35aae54ce8135408b3fa33abfc3cb384eb0

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Resolve version from Cargo.toml
        id: resolve
        env:
          REF_NAME: ${{ github.ref_name }}
          EVENT_NAME: ${{ github.event_name }}
          SHA: ${{ github.sha }}
        run: |
          read_version() {
            awk '
              /^\[package\]$/ { in_package = 1; next }
              /^\[/ && in_package { exit }
              in_package && $1 == "version" { gsub(/"/, "", $3); print $3; exit }
            ' "$1"
          }
          app_version="$(read_version crates/desktop_app/Cargo.toml)"
          cli_version="$(read_version crates/cli/Cargo.toml)"
          if [[ "$app_version" != "$cli_version" ]]; then
            echo "desktop_app($app_version) 与 cli($cli_version) 的 Cargo 版本不一致" >&2
            exit 1
          fi
          if [[ ! "$app_version" =~ ^[0-9]+(\.[0-9]+)+$ ]]; then
            echo "Cargo 版本 '$app_version' 不合法：只能是数字和点（rpm 不允许连字符）" >&2
            exit 1
          fi
          version="v$app_version"

          # 推 tag 触发时，tag 必须和 Cargo 版本一致，否则安装包里的版本号会对不上 tag。
          if [[ "$EVENT_NAME" == "push" && "$REF_NAME" != "$version" ]]; then
            echo "tag '$REF_NAME' 与 Cargo 版本 '$version' 不一致，请先修改 Cargo.toml 再打 tag" >&2
            exit 1
          fi

          # 手动触发时，如果同名 tag 已存在且不在当前提交上，说明忘了升版本号。
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag_sha="$(git ls-remote origin "refs/tags/$version^{}" "refs/tags/$version" | awk 'NR==1 {print $1}')"
            if [[ -n "$tag_sha" && "$tag_sha" != "$SHA" ]]; then
              echo "tag $version 已存在且指向 ${tag_sha:0:8}（当前提交 ${SHA:0:8}），请先升高 Cargo 版本号" >&2
              exit 1
            fi
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  test:
    name: Workspace tests
    # 开关：手动触发勾选 run_tests，或 tag 指向的提交信息含 [test]。
    if: >-
      (github.event_name == 'workflow_dispatch' && inputs.run_tests) ||
      (github.event_name == 'push' && contains(github.event.head_commit.message, '[test]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            pkg-config \
            fonts-dejavu-core \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Setup Bun for plugin runtime tests
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - name: Run workspace tests
        run: cargo test --workspace --release

  build-windows-setup:
    name: Build Windows x64 Setup
    needs: [meta]
    runs-on: windows-latest
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: x86_64-pc-windows-msvc

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install Inno Setup
        run: choco install innosetup --version="$env:INNOSETUP_VERSION" --no-progress -y

      - name: Build Setup.exe
        shell: pwsh
        run: .\scripts\build-setup.ps1 -Version "${env:VERSION}" -Arch x64 -Target x86_64-pc-windows-msvc

      - name: Upload Setup artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termarx-setup-x64
          path: target/dist/Termarx-${{ env.VERSION }}-windows-x64-Setup.exe
          if-no-files-found: error

  build-linux:
    name: Build Linux x86_64
    if: false # 暂时屏蔽，只发 Windows
    needs: [meta]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      VERSION: ${{ needs.meta.outputs.version }}
      ARCH: x86_64
      TARGET: x86_64-unknown-linux-gnu
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            cmake \
            clang \
            pkg-config \
            libfontconfig-dev \
            libwayland-dev \
            libx11-xcb-dev \
            libxkbcommon-x11-dev \
            libssl-dev \
            libzstd-dev \
            libasound2-dev \
            libvulkan1 \
            rpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ env.TARGET }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Build Linux tarball
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET"

      - name: Install appimagetool
        run: |
          curl -fsSL -o /tmp/appimagetool.AppImage \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-${ARCH}.AppImage"
          echo "${APPIMAGETOOL_X86_64_SHA256}  /tmp/appimagetool.AppImage" | sha256sum -c -
          chmod +x /tmp/appimagetool.AppImage
          echo "APPIMAGETOOL=/tmp/appimagetool.AppImage" >> "$GITHUB_ENV"

      - name: Build Linux AppImage
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format appimage

      - name: Build Linux deb
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format deb

      - name: Build Linux rpm
        run: ./scripts/build-linux.sh --version "$VERSION" --arch "$ARCH" --target "$TARGET" --format rpm

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termarx-linux-${{ env.ARCH }}
          path: |
            target/dist/Termarx-${{ env.VERSION }}-linux-${{ env.ARCH }}.tar.gz
            target/dist/Termarx-${{ env.VERSION }}-linux-${{ env.ARCH }}.AppImage
            target/dist/Termarx-${{ env.VERSION }}-linux-${{ env.ARCH }}.deb
            target/dist/Termarx-${{ env.VERSION }}-linux-${{ env.ARCH }}.rpm
          if-no-files-found: error

  build-dmg:
    name: Build ${{ matrix.arch }} DMG (unsigned)
    if: false # 暂时屏蔽，只发 Windows
    needs: [meta]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: arm64
            target: aarch64-apple-darwin
            runner: macos-26
          - arch: x86_64
            target: x86_64-apple-darwin
            runner: macos-26
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32 # v2

      - name: Install cargo-bundle
        run: cargo install cargo-bundle --locked

      # 不传签名身份，build-dmg.sh 会产出未签名的 DMG；首次打开需在系统设置里手动放行。
      - name: Build unsigned DMG
        run: ./scripts/build-dmg.sh --version "$VERSION" --arch "${{ matrix.arch }}" --target "${{ matrix.target }}" --no-layout

      - name: Upload DMG artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: termarx-dmg-${{ matrix.arch }}
          path: dist/Termarx-${{ env.VERSION }}-macos-${{ matrix.arch }}.dmg
          if-no-files-found: error

  publish-release:
    name: Publish GitHub Release
    needs:
      - meta
      - build-windows-setup
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true

      - name: Generate SHA256 checksums
        shell: bash
        run: |
          cd dist
          find . -maxdepth 1 -type f -name '*.exe' -print0 \
            | sort -z \
            | xargs -0 sha256sum > checksums.txt

      - name: Create release and upload assets
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          name: Termarx ${{ env.VERSION }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/checksums.txt
          fail_on_unmatched_files: true
          overwrite_files: true
